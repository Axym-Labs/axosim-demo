name: Demo CPU tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install headless rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev libosmesa6-dev ffmpeg
      - name: Install pinned demo dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-demo.lock pytest pytest-cov
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Test source, exact graph importer, and actual fly body
        env:
          MUJOCO_GL: egl
        # Private trained-weight tests skip explicitly when the checkpoint is
        # absent. Their locally executed evidence lives in the internal repo.
        run: .venv/bin/python -m pytest tests/test_axosim_*.py tests/test_neuron_fidelity.py tests/test_tikz_plot.py tests/test_scene_overlay.py -q -o addopts=''
